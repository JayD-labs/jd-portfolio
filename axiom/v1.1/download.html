<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Axiom 🐸 v1.1 Installer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#f2f2f2}
main{width:min(92vw,620px);padding:32px;border:1px solid #2a2a2a;border-radius:22px;background:#181818;box-shadow:0 20px 70px #0008}
h1{margin:0 0 10px;font-size:2rem}p{line-height:1.55;color:#d3d3d3}
a.button{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;background:#0b6406;color:white;text-decoration:none;font-weight:700}
small{display:block;margin-top:18px;color:#8f8f8f;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Axiom 🐸 v1.1</h1>
<p>Der Installer wird heruntergeladen. Falls dein Browser nicht automatisch startet, nutze den Button.</p>
<a class="button" id="fallback" href="./install.sh" download="install.sh">⬇️ install.sh herunterladen</a>
<small>SHA-256: 277944021e2ca93ba5151117bc3f6c45727292df484af3111a350fd92801e538</small>
</main>
<script>
(async()=>{try{const r=await fetch("./install.sh",{cache:"no-store"});if(!r.ok)throw new Error();const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="install.sh";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}catch(e){}})();
</script>
</body>
</html>
